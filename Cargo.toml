[package]
name = "mto2"
version = "0.1.0"
edition = "2021"
description = "Max-tree based source detection and segmentation (MTO2 port)"
license = "MIT"

[lib]
name = "mto2"
path = "src/lib.rs"

[[bin]]
name = "mto2"
path = "src/main.rs"

[dependencies]
fitsio = "0.21"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
